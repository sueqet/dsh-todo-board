# dsh-todo-board bundle patch: one insert over the profile tree.
#
# The plugin row activates only when this package is installed as a profile
# dependency (e.g. `dsh plugin --profile web add link:<dir>`).
#
# Host half owns the board file, the `todo_board` model tool, the turn-end
# auto-continue hook, the prompt section, and the /dsh-todo-board/api route.
# Browser half renders the floating panel in `shell.overlay`.
#
# IMPORTANT: this is an `insert`. Do not ALSO declare a top-level `- id:`
# entry for the same id in your own cordis.patch.yml, or the plugin would
# register twice.
- insert:
    - id: todo-board
      name: 'dsh-todo-board'
